<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubBridge · 字幕桥</title>
  <link rel="icon" type="image/svg+xml" href="/assets/subtitle-steward.svg">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="/assets/subtitle-steward.svg" alt="">
      <div>
      <p class="eyebrow">D1.5 · READ ONLY</p>
      <h1>SubBridge <span class="brand-short">SB · 字幕桥</span></h1>
      </div>
    </div>
    <button id="logout" class="secondary hidden" type="button">退出</button>
  </header>

  <main class="shell">
    <section id="login-panel" class="panel login-panel">
      <h2>连接服务</h2>
      <p class="muted">输入管理 API Bearer Token。Token 只保留在当前页面内存，刷新后需要重新输入。</p>
      <form id="login-form" autocomplete="off">
        <input class="visually-hidden" type="text" name="username" autocomplete="username" value="viewer" tabindex="-1" aria-hidden="true">
        <label for="token">Bearer Token</label>
        <div class="token-row">
          <input id="token" type="password" autocomplete="new-password" spellcheck="false" required>
          <button type="submit">登录</button>
        </div>
      </form>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="app-panel" class="hidden">
      <div class="toolbar panel">
        <label for="library">媒体库</label>
        <select id="library" disabled>
          <option value="">请先登录</option>
        </select>
        <button id="load-items" type="button" disabled>加载</button>
        <span id="app-status" class="muted" role="status"></span>
      </div>

      <div class="content-grid">
        <section class="panel">
          <div class="section-heading">
            <div>
              <h2>Movie / Episode</h2>
              <p class="muted">沿用服务端混合分页，每页只请求一次列表。</p>
            </div>
            <div class="pager">
              <button id="previous-page" class="secondary" type="button" disabled>上一页</button>
              <span id="page-status" class="muted">未加载</span>
              <button id="next-page" class="secondary" type="button" disabled>下一页</button>
            </div>
          </div>
          <div id="items" class="item-list empty-state">请选择媒体库。</div>
        </section>

        <section class="panel detail-panel">
          <h2>媒体详情</h2>
          <div id="detail" class="empty-state">选择一个 Movie 或 Episode 查看详情。</div>
        </section>
      </div>
    </section>
  </main>

  <script src="/assets/app.js" defer></script>
</body>
</html>
