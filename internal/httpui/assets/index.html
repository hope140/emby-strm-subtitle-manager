<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SubBridge · 字幕桥</title>
  <link rel="icon" type="image/svg+xml" href="/assets/subtitle-steward.svg">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="/assets/subtitle-steward.svg" alt="">
      <div>
      <p class="eyebrow">D1.5 · D3 CONTROLLED ADD</p>
      <h1>SubBridge <span class="brand-short">SB · 字幕桥</span></h1>
      </div>
    </div>
  </header>

  <main class="shell">
    <section id="login-panel" class="panel login-panel">
      <h2>连接服务</h2>
      <p class="muted">输入 Docker 部署时配置的管理员账号和密码。登录会话由服务端短期保留，密码不在面板中修改。</p>
      <form id="login-form" autocomplete="off">
        <label for="username">管理员用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" required>
        <label for="password">管理员密码</label>
        <div class="token-row">
          <input id="password" name="password" type="password" autocomplete="current-password" spellcheck="false" required>
          <button type="submit">登录</button>
        </div>
      </form>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="app-panel" class="hidden">
      <div class="toolbar panel">
        <label for="library">媒体库</label>
        <select id="library" disabled>
          <option value="">请先登录</option>
        </select>
        <button id="load-items" type="button" disabled>加载</button>
        <span id="app-status" class="muted" role="status"></span>
      </div>

      <div class="content-grid">
        <section class="panel">
          <div class="section-heading">
            <div>
              <h2>Movie / Episode</h2>
              <p class="muted">沿用服务端混合分页，每页只请求一次列表。</p>
            </div>
            <div class="pager">
              <button id="previous-page" class="secondary" type="button" disabled>上一页</button>
              <span id="page-status" class="muted">未加载</span>
              <button id="next-page" class="secondary" type="button" disabled>下一页</button>
            </div>
          </div>
          <div id="items" class="item-list empty-state">请选择媒体库。</div>
        </section>

        <section class="panel detail-panel">
          <h2>媒体详情</h2>
          <div id="detail" class="empty-state">选择一个 Movie 或 Episode 查看详情。</div>
          <section id="d2-panel" class="d2-panel hidden" aria-labelledby="d2-heading">
            <div class="section-heading">
              <div>
                <h3 id="d2-heading">D2 搜索预览</h3>
                <p class="muted">只对当前选定的单源 Movie / Episode 请求中文候选。</p>
              </div>
            </div>
            <p id="d2-status" class="d2-status" role="status"></p>
            <div id="d2-actions" class="d2-actions hidden">
              <label class="checkbox-label" for="d2-forced">
                <input id="d2-forced" type="checkbox">
                仅强制字幕
              </label>
              <button id="d2-search" type="button">搜索</button>
            </div>
            <div id="d2-results" class="d2-results hidden">
              <div class="section-heading compact-heading">
                <h4>候选</h4>
                <span id="d2-result-status" class="muted" role="status"></span>
              </div>
              <div id="d2-candidates" class="candidate-list"></div>
            </div>
            <section id="d2-preview" class="preview-panel hidden" aria-labelledby="d2-preview-heading">
              <div class="section-heading compact-heading">
                <div>
                  <h4 id="d2-preview-heading">字幕预览</h4>
                  <p id="d2-artifact-meta" class="muted"></p>
                </div>
              </div>
              <div class="preview-toolbar">
                <label for="d2-preview-limit">每页</label>
                <select id="d2-preview-limit">
                  <option value="200">200 条</option>
                  <option value="500">500 条</option>
                </select>
                <button id="d2-preview-previous" class="secondary" type="button" disabled>上一页</button>
                <button id="d2-preview-next" class="secondary" type="button" disabled>下一页</button>
                <button id="d2-preview-reset" class="secondary" type="button">回到开头</button>
                <span id="d2-preview-status" class="muted" role="status"></span>
              </div>
              <div id="d2-cues" class="cue-list"></div>
              <div id="d3-add" class="d2-actions hidden">
                <span class="muted">已通过校验的字幕只会写入当前专用样本，并触发一次 Emby 刷新。</span>
                <button id="d3-add-button" type="button">添加到当前媒体</button>
                <span id="d3-add-status" class="muted" role="status"></span>
              </div>
            </section>
          </section>
        </section>
      </div>
    </section>
  </main>

  <script src="/assets/app.js" defer></script>
</body>
</html>
