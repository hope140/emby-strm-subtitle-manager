# D2 Canary-only overlay. Combine this file with either base topology:
#   docker compose -f compose.example.yaml -f compose.d2-canary.example.yaml ...
#   docker compose -f compose.host-network.example.yaml -f compose.d2-canary.example.yaml ...
# This overlay does not enable D2 by itself; the separately authorized config
# must set remote_search_enabled=true and d2.canary.enabled=true.
services:
  app:
    secrets:
      - source: d2_canary_items
        target: d2_canary_items
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      # The only writable application-data mount. Prepare the host source as
      # 10001:10001 and 0700, and keep it outside every media mapping.
      - type: bind
        source: /replace/with/dedicated/d2-preview-cache
        target: /var/lib/subbridge/d2-preview-cache
        read_only: false

secrets:
  d2_canary_items:
    # The file must exist before Compose config/up. Keep it outside media;
    # Compose uid/gid/mode are best-effort and do not replace host checks.
    file: ./secrets/d2_canary_items
