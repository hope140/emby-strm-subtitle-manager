name: subbridge

# Use this topology when Emby already listens on the Docker host network.
# The application also uses host networking, but its configured listener stays
# on host loopback so no management port is exposed publicly.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        BUILD_SOURCE: "${BUILD_SOURCE:-https://github.com/hope140/subbridge}"
    image: subbridge:${IMAGE_TAG:-local}
    command:
      - -config
      - /etc/subbridge/config.yaml
    environment:
      # Replace both empty placeholders in the private Compose file.
      # Do not commit or push the actual credentials.
      APP_ADMIN_USERNAME: ""
      APP_ADMIN_PASSWORD: ""
    network_mode: host
    user: "10001:10001"
    read_only: true
    init: true
    restart: unless-stopped
    configs:
      - source: app_config
        target: /etc/subbridge/config.yaml
        mode: 0444
    secrets:
      - source: emby_api_key
        target: emby_api_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: app_identity_key
        target: app_identity_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: app_api_auth_token
        target: app_api_auth_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      # Replace these sources in the private Compose file. Keep recovery data
      # outside the Emby media mapping.
      - type: bind
        source: /replace/with/host/media/root
        target: /media
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d2-preview-cache
        target: /var/lib/subbridge/d2-preview-cache
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d3-history
        target: /var/lib/subbridge/d3-history
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d3-quarantine
        target: /var/lib/subbridge/d3-quarantine
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d3-archive
        target: /var/lib/subbridge/d3-archive
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d3-trash
        target: /var/lib/subbridge/d3-trash
        read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

configs:
  app_config:
    file: ./config.host-network.yaml

secrets:
  emby_api_key:
    # File-source uid/gid/mode are not trusted across Docker setups. On the
    # host, set every secret file owner to 10001:10001 and mode to 0400.
    file: ./secrets/emby_api_key
  app_identity_key:
    # On the host, chown this file to 10001:10001 and chmod 0400 before start.
    file: ./secrets/app_identity_key
  app_api_auth_token:
    # File-source uid/gid/mode settings are not trusted across Docker setups.
    # On the host, chown this file to 10001:10001 and chmod 0400 before start.
    file: ./secrets/app_api_auth_token
