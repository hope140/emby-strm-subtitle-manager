# Core A/B daily write overlay. Combine it with exactly one base topology only
# after a separate deployment authorization. It does not turn features on by
# itself: config.yaml must explicitly enable remote_search_enabled,
# write_enabled and the subtitle:write API scope. The base Compose remains
# read-only and is the normal default.
services:
  app:
    # The root filesystem remains read-only. These are the complete writable
    # boundaries for validated artifacts, media sidecars and recoverable state.
    volumes:
      - type: bind
        source: /replace/with/host/media/root
        target: /media
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d2-preview-cache
        target: /var/lib/subbridge/d2-preview-cache
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d3-history
        target: /var/lib/subbridge/d3-history
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d3-quarantine
        target: /var/lib/subbridge/d3-quarantine
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d3-archive
        target: /var/lib/subbridge/d3-archive
        read_only: false
      - type: bind
        source: /replace/with/dedicated/d3-trash
        target: /var/lib/subbridge/d3-trash
        read_only: false
