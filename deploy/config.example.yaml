server:
  # Container-internal bind; the Compose ports entry keeps the host bind on
  # loopback. Do not use the host's public interface here.
  listen_address: 0.0.0.0:8080

emby:
  url: https://emby.example.invalid
  api_key_file: /run/secrets/emby_api_key
  timeout_seconds: 30

security:
  identity_key_file: /run/secrets/app_identity_key
  api_auth_token_file: /run/secrets/app_api_auth_token
  # The application Bearer token may perform the same subtitle operations as
  # an authenticated administrator. Keep this token private.
  api_auth_scopes:
    - media:read
    - subtitle:search
    - subtitle:preview
    - subtitle:write
  # Compose must provide APP_ADMIN_USERNAME and APP_ADMIN_PASSWORD directly.
  # These credentials are intentionally not stored in YAML.
  # Set true when the browser always reaches the service through HTTPS.
  session_cookie_secure: false
  session_ttl_seconds: 28800

features:
  write_enabled: true
  remote_search_enabled: true

d2:
  # Stable, dedicated application storage. Keep it outside every media
  # mapping; do not use /, /srv, a media root, a media parent, a media child,
  # a temporary directory, or a symlinked path.
  cache_dir: /var/lib/subbridge/d2-preview-cache
  canary:
    enabled: false
    # One exact approved Emby Item ID per line, injected read-only as a Secret.
    item_allowlist_file: /run/secrets/d2_canary_items

d3:
  # Daily writes are enabled by default. Canary remains an optional narrower
  # admission mode for one-off production verification.
  history_dir: /var/lib/subbridge/d3-history
  quarantine_dir: /var/lib/subbridge/d3-quarantine
  archive_dir: /var/lib/subbridge/d3-archive
  trash_dir: /var/lib/subbridge/d3-trash
  refresh_timeout_seconds: 10
  canary:
    enabled: false
    item_allowlist_file: /run/secrets/d3_canary_items

path_mappings:
  # Replace the placeholder with the exact Emby-reported media root. The
  # local side must remain /media, which is mounted read-only by Compose.
  - emby: /replace/with/emby/media/root
    local: /media
