server:
  # Keep the management API on host loopback even though the container uses
  # host networking.
  listen_address: 127.0.0.1:18080

emby:
  # Replace the port only if the local Emby listener differs.
  url: http://127.0.0.1:8096
  api_key_file: /run/secrets/emby_api_key
  timeout_seconds: 30

security:
  identity_key_file: /run/secrets/app_identity_key
  api_auth_token_file: /run/secrets/app_api_auth_token
  # The application Bearer token is read-only. Write scopes are reserved and
  # rejected while writes are disabled.
  api_auth_scopes:
    - media:read
    - subtitle:search
    - subtitle:preview
  # Compose must provide APP_ADMIN_USERNAME and APP_ADMIN_PASSWORD directly.
  # These credentials are intentionally not stored in YAML.
  # Set true when the browser always reaches the service through HTTPS.
  session_cookie_secure: false
  session_ttl_seconds: 28800

features:
  write_enabled: false
  remote_search_enabled: false

d2:
  # Stable, dedicated application storage. Keep it outside every media
  # mapping; do not use /, /srv, a media root, a media parent, a media child,
  # a temporary directory, or a symlinked path.
  cache_dir: /var/lib/emby-strm-subtitle-manager/d2-preview-cache
  canary:
    enabled: false
    # One exact approved Emby Item ID per line, injected read-only as a Secret.
    item_allowlist_file: /run/secrets/d2_canary_items

path_mappings:
  - emby: /replace/with/emby/media/root
    local: /media
