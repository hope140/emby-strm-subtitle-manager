name: Release image

on:
  push:
    tags:
      - "v*"

# A release needs to publish the image and create the matching GitHub Release.
# Keyless cosign signing receives its short-lived identity from GitHub OIDC.
permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/hope140/subbridge

jobs:
  release:
    name: Build, sign, and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate immutable build metadata
        id: metadata
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date --utc --iso-8601=seconds)" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.metadata.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_TIME=${{ steps.metadata.outputs.created }}
            BUILD_SOURCE=${{ steps.metadata.outputs.source }}
          labels: |
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.commit }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.source=${{ steps.metadata.outputs.source }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign immutable image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          gh release create "$VERSION" \
            --title "SubBridge $VERSION" \
            --generate-notes \
            --notes "Container image: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
