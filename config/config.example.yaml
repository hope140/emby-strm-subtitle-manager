server:
  listen_address: 127.0.0.1:8080

emby:
  url: https://emby.example.invalid
  api_key_file: /run/secrets/emby_api_key
  timeout_seconds: 30

security:
  identity_key_file: /run/secrets/app_identity_key
  api_auth_token_file: /run/secrets/app_api_auth_token

features:
  write_enabled: false
  remote_search_enabled: false

path_mappings:
  - emby: /srv/emby/media
    local: /media
